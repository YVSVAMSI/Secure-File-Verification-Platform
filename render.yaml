# Render Blueprint for Secure File Verification Platform
# https://render.com/docs/blueprint-spec

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: secure-file-verification-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false # Set database connection URL in Render dashboard or use existing DB
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # 2. Angular Frontend Web Service
  - type: web
    name: secure-file-verification-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: free
