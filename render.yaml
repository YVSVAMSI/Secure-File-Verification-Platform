# Render Blueprint for Secure File Verification Platform
# https://render.com/docs/blueprint-spec

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: secure-file-verification-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /
    envVars:
      # Do NOT set PORT: Render injects PORT=10000 and health-checks that port.
      # application.properties binds to whatever PORT is provided.
      # Leave unset to fall back to the in-memory H2 database (data resets on redeploy).
      # To persist data, create a Render PostgreSQL instance and set these three vars.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # 2. Angular Frontend Web Service (Nginx binds to $PORT, injected by Render)
  - type: web
    name: secure-file-verification-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: free
    healthCheckPath: /
